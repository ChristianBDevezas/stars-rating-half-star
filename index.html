<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stars Rating</title>
    <link rel="stylesheet" href="stars-rating.css">
    <!--Awesome Icons-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <!--Google Fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <section class="stars">
            <div class="stars__item">
                <i class="fa-solid fa-star fa-2x"></i>
                <i class="fa-solid fa-star fa-2x color point-half"></i>
                <i class="fa-solid fa-star fa-2x color point-full"></i>

                <div class="points">
                    <div class="point left"></div>
                    <div class="point right"></div>
                </div>
            </div>

            <div class="stars__item">
                <i class="fa-solid fa-star fa-2x"></i>
                <i class="fa-solid fa-star fa-2x color point-half"></i>
                <i class="fa-solid fa-star fa-2x color point-full"></i>

                <div class="points">
                    <div class="point left"></div>
                    <div class="point right"></div>
                </div>
            </div>

            <div class="stars__item">
                <i class="fa-solid fa-star fa-2x"></i>
                <i class="fa-solid fa-star fa-2x color point-half"></i>
                <i class="fa-solid fa-star fa-2x color point-full"></i>

                <div class="points">
                    <div class="point left"></div>
                    <div class="point right"></div>
                </div>
            </div>

            <div class="stars__item">
                <i class="fa-solid fa-star fa-2x"></i>
                <i class="fa-solid fa-star fa-2x color point-half"></i>
                <i class="fa-solid fa-star fa-2x color point-full"></i>

                <div class="points">
                    <div class="point left"></div>
                    <div class="point right"></div>
                </div>
            </div>

            <div class="stars__item">
                <i class="fa-solid fa-star fa-2x"></i>
                <i class="fa-solid fa-star fa-2x color point-half"></i>
                <i class="fa-solid fa-star fa-2x color point-full"></i>

                <div class="points">
                    <div class="point left"></div>
                    <div class="point right"></div>
                </div>
            </div>
        </section>

        <section class="counter">
            <span class="counter__stars">0</span>
            <span class="counter__text">star</span>
        </section>
    </div>

    <!--JS-->
    <script src="stars-rating.js"></script>
</body>
</html>
